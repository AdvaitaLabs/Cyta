[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advaita-virtualcell-model"
version = "0.1.0"
description = "Context-aware perturbation response modeling with constrained single-cell count generation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "CC-BY-NC-SA-4.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Advaita Lab"}]
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "pandas>=2.2,<4",
  "anndata>=0.10,<0.14",
  "h5py>=3.11,<4",
  "threadpoolctl>=3.5,<4",
]

[project.optional-dependencies]
model = ["torch>=2.8,<3", "arc-pie @ git+https://github.com/ArcInstitute/pie.git@038940057545ae686db946ae247aeb0ff0101897"]
evaluation = ["cell-eval2==0.16.0"]
dev = ["pytest>=8,<10", "ruff>=0.9", "build>=1.2"]

[project.scripts]
advaita = "advaita_virtualcell.cli:main"

[project.urls]
Repository = "https://github.com/yfsong00/Advaita_Lab_VirtualCell_Model"
Issues = "https://github.com/yfsong00/Advaita_Lab_VirtualCell_Model/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/test_training.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
